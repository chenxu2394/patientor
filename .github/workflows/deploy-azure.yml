name: Deploy Azure

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/deploy-azure.yml
      - Dockerfile
      - data/**
      - infra/**
      - package.json
      - package-lock.json
      - patientor-frontend/**
      - src/**
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: azure-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_BOOTSTRAPPED == 'true' && github.ref_name == vars.AZURE_DEPLOYMENT_BRANCH
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select immutable container image
        shell: bash
        run: |
          repository="$(jq -r '.containerImageRepository' infra/deployment.config.json)"
          echo "CONTAINER_REPOSITORY=${repository}" >> "${GITHUB_ENV}"
          echo "CONTAINER_IMAGE=${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.CONTAINER_IMAGE }}
            ${{ env.CONTAINER_REPOSITORY }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview infrastructure changes
        uses: azure/bicep-deploy@v2.3.0
        with:
          type: deployment
          operation: whatIf
          name: patientor-v1-what-if
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          template-file: ./infra/main.bicep
          parameters-file: ./infra/main.bicepparam
          parameters: |
            containerImage: ${{ env.CONTAINER_IMAGE }}

      - name: Deploy infrastructure
        id: infrastructure
        uses: azure/bicep-deploy@v2.3.0
        with:
          type: deployment
          operation: create
          name: patientor-v1
          scope: resourceGroup
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          template-file: ./infra/main.bicep
          parameters-file: ./infra/main.bicepparam
          parameters: |
            containerImage: ${{ env.CONTAINER_IMAGE }}
